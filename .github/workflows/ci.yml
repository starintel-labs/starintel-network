name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed on unrecognized schema-lock state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("schema/starintel-schema.lock.json").read_text())
          if lock.get("status") == "pending-0.10.1":
              print("schema lock pending canonical 0.10.1; pin checks skipped")
          elif "canonical_commit" in lock:
              print("concrete lock detected; restore pin checks in ci + tests")
              raise SystemExit(1)
          else:
              raise SystemExit(f"unrecognized schema lock: {lock}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: python
        run: ruff check .

      - name: mypy
        working-directory: python
        run: mypy

      - name: Pytest
        working-directory: python
        run: pytest -q

      - run: python -m pip check
